name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          # `.venv` is not present in CI, but the exclusions are kept in step with the
          # Makefile so a local `make sbom` and this step describe the same thing.
          upload-artifact-retention: 30

  vulnerabilities:
    name: no CRITICAL vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Report everything for visibility...
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          # Without the skips and the raised timeout, secret scanning walks `.git` past
          # trivy's 5-minute default and the step dies on a context deadline rather than
          # on a finding. Measured locally before it was written here.
          skip-dirs: .venv,node_modules,var,.git
          timeout: 30m

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      # ...but only CRITICAL blocks the merge (RNF-04).
      - name: Trivy gate (CRITICAL only)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .venv,node_modules,var,.git
          timeout: 30m

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Build agent-api image
        run: docker build -f deploy/compose/Dockerfile --target api -t agent-forge/api:ci .

      - name: Scan image (CRITICAL blocks)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: agent-forge/api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
