name: repo-graph

on:
  schedule:
    - cron: "0 3 * * 1"     # weekly, Monday 03:00 UTC (RF-12)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: regenerate graph and REPO_MAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --extra dev

      - name: Build repository graph
        run: uv run python scripts/repo_graph.py --root . --out docs/graphs --repo-map docs/REPO_MAP.md

      - name: Verify generated docs are complete
        run: uv run python scripts/docs_check.py --strict

      - name: Open a PR if the map drifted
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(repo-graph): regenerate repository map"
          title: "docs(repo-graph): regenerate repository map"
          body: |
            Regenerado automáticamente por `scripts/repo_graph.py`.

            `docs/REPO_MAP.md` y `docs/graphs/` derivan del AST: si este PR tiene
            cambios, es que el código se movió y el mapa iba por detrás.
          branch: chore/repo-graph
          delete-branch: true
          add-paths: |
            docs/REPO_MAP.md
            docs/graphs/
