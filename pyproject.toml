[project]
name = "agent-forge"
version = "0.1.0"
description = "Agent Forge - reusable, multi-tenant, production-ready enterprise agent cell for the PEAK architecture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Silent4Business" }]
keywords = ["langgraph", "agents", "mcp", "a2a", "rag", "graphrag", "multi-tenant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime: everything needed for `agent-api` to boot, serve chat and enforce
# governance. Heavy/optional stacks live in the extras below (see ADR-005).
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-redis==0.5.2",
  "langchain-core==1.6.1",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "python-multipart==0.0.32",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "litellm==1.99.0",
  "redis==7.1.0",
  "asyncpg==0.31.0",
  # langgraph-checkpoint-postgres speaks psycopg3; the binary wheel ships libpq so
  # the image needs no system postgres client.
  "psycopg[binary,pool]==3.3.5",
  "nats-py==2.15.0",
  "cloudevents==2.2.0",
  "mcp==2.1.1",
  "a2a-sdk==1.1.2",
  "tenacity==9.1.4",
  "structlog==26.1.0",
  "pyjwt[crypto]==2.13.0",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "typer==0.26.0",
  "rich==14.2.0",
  "croniter==6.2.4",
  "networkx==3.6.1",
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "rank-bm25==0.2.2",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-instrumentation-redis==0.65b0",
]

[project.optional-dependencies]
# Clients for the stores retrieval reads. Needed by the API *and* the worker: the API
# retrieves on every request, and without this it falls back to an in-memory store that
# the worker never writes to -- two processes disagreeing about where the corpus lives.
knowledge = [
  "qdrant-client==1.19.0",
  "neo4j==6.3.0",
]
# Document parsing, for the ingestion side only. Split out of `knowledge` because docling
# pulls torch: roughly 9 GB that the API image was never going to use, on every node, on
# every rollout.
parsing = [
  "docling==2.124.0",
  "lightrag-hku==1.5.6",
]
# Long-term memory providers.
memory = [
  "mem0ai==2.0.19",
  "graphiti-core==0.29.3",
]
# PII detection/anonymisation (ES/EN). Optional: without it the built-in
# deterministic scrubber in governance/dlp.py is used (see ADR-006).
guardrails = [
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
]
# Optional ML prompt-firewall. MUTUALLY EXCLUSIVE with the `knowledge` extra:
# llm-guard pins json-repair==0.44.1, lightrag-hku requires >=0.59.9 (ADR-006).
# The built-in rule-based firewall is always active regardless of this extra.
promptguard = [
  "llm-guard==0.3.16",
]
# Database connector drivers beyond Postgres/Redis (which are core).
databases = [
  "sqlalchemy[asyncio]==2.0.52",
  "asyncmy==0.2.14",
  "motor==3.7.1",
]
# Ingestion sources.
sources = [
  "msgraph-sdk==1.61.0",
  "azure-identity==1.25.3",
  "aiobotocore==3.9.0",
]
# LLM tracing and evaluation harness.
evals = [
  "langfuse==4.15.1",
  "deepeval==4.2.0",
  "ragas==0.4.3",
  # Ragas imports `langchain_community.chat_models.vertexai`, which 0.4.x removed, and
  # declares no upper bound of its own. Without this pin `import ragas` raises
  # ModuleNotFoundError and the whole extra is unusable. See ADR-009.
  "langchain-community==0.3.31",
]
# Optional time-series analytics (RF-14), disabled by default.
analytics = [
  "statsforecast==2.1.1",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "testcontainers==4.15.0",
  "ruff==0.16.5",
  "mypy==2.3.1",
  "types-pyyaml==6.0.12.20260815",
  "types-networkx==3.6.1.20260728",
  "pre-commit==4.6.2",
]

[project.scripts]
agent-forge = "agent_forge.cli:app"

# Plugin architecture: adding a connector / subgraph / channel never touches the core.
# Each target is a zero-argument factory: the registry builds the connector from the
# environment, so a cell without the corresponding configuration simply reports the
# connector unhealthy instead of failing to start.
[project.entry-points."agent_forge.connectors"]
mcp_gateway = "agent_forge.connectors.mcp_client:McpGatewayConnector.from_env"
n8n = "agent_forge.connectors.n8n:N8nConnector.from_env"
postgres = "agent_forge.connectors.databases:postgres_connector"
mysql = "agent_forge.connectors.databases:mysql_connector"
mongodb = "agent_forge.connectors.databases:mongodb_connector"
redis = "agent_forge.connectors.databases:redis_connector"
repo_graph = "agent_forge.connectors.repo_graph:RepoGraphConnector"

[project.entry-points."agent_forge.subgraphs"]
generalist = "agent_forge.core.subgraphs.generalist:GeneralistSubgraph"
it_support = "agent_forge.core.subgraphs.it_support:ItSupportSubgraph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forge"]

[tool.uv]
package = true
# `promptguard` (llm-guard) is heavily pinned upstream and cannot coexist with the
# GraphRAG/PII stacks. Declared as a conflicting extra so the universal lock stays
# solvable while each install target remains reproducible. See ADR-006.
conflicts = [
  # The pin that forces this is lightrag-hku's, so the conflict follows it into
  # `parsing`. Consequence worth noting: `knowledge` and `promptguard` are no longer
  # mutually exclusive, so an API pod can run the ML prompt firewall and still retrieve.
  [{ extra = "parsing" }, { extra = "promptguard" }],
  [{ extra = "guardrails" }, { extra = "promptguard" }],
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "ASYNC", "S"]
ignore = [
  "S101",   # assert is fine in tests and internal invariants
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF001", # ambiguous unicode in Spanish docstrings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
# scripts/ is not an installed package; tests import its modules directly.
known-local-folder = ["repo_graph", "docs_check", "coverage_gate", "new_instance", "new_connector", "ingest", "verify_ledger", "seed", "run_evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S105", "S106", "S311"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agent_forge", "scripts"]
mypy_path = "src"
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "asyncpg.*", "psycopg.*", "redis.*",
  "litellm.*", "nats.*", "cloudevents.*", "qdrant_client.*", "neo4j.*",
  "docling.*", "lightrag.*", "mem0.*", "graphiti_core.*", "presidio_analyzer.*",
  "presidio_anonymizer.*", "llm_guard.*", "rank_bm25.*", "croniter.*",
  "tree_sitter.*", "tree_sitter_python.*", "motor.*", "asyncmy.*", "langfuse.*",
  "testcontainers.*", "a2a.*", "statsforecast.*", "msgraph.*", "azure.*", "aiobotocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `-p no:deepeval`: installing the `evals` extra registers a pytest plugin that reads
# `.env` at startup and refuses an empty `AZURE_OPENAI_ENDPOINT`. With both present the
# session dies before collecting a single test. We never drive deepeval from pytest --
# the harness calls it directly -- so the plugin has nothing to contribute and every
# reason to stay out.
addopts = "-q --strict-markers --import-mode=importlib -p no:deepeval"
pythonpath = ["."]
markers = [
  "integration: requires live infrastructure (docker compose profile)",
  "e2e: full stack end-to-end",
  "slow: long running",
]

[tool.coverage.run]
source = ["src/agent_forge"]
branch = true
omit = ["*/analytics/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
