# Prometheus scrape configuration for a single Agent Forge cell.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance_name: ${AGENT_FORGE_INSTANCE:-default}

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: agent-api
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-api:8080"]

  # Application traces/metrics arrive via OTLP and leave the collector here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
