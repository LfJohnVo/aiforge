{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agent-forge.fullname" . }}
  labels: {{- include "agent-forge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agent-forge.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Cinco minutos antes de bajar. Una celula espera al modelo, asi que su CPU cae
      # entre peticiones; escalar hacia abajo con la ventana por defecto produce un
      # vaiven que cuesta mas que las replicas.
      stabilizationWindowSeconds: 300
{{- end }}
